name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION="$(python -c "from utils.app_info import APP_VERSION; print(APP_VERSION)")"
          if [[ "$GITHUB_REF_NAME" != "v${APP_VERSION}" ]]; then
            echo "[ERROR] Tag '$GITHUB_REF_NAME' does not match APP_VERSION 'v${APP_VERSION}'." >&2
            exit 1
          fi
          echo "Verified tag $GITHUB_REF_NAME matches APP_VERSION $APP_VERSION."

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Compile Python sources
        run: python -m compileall -q adapters controllers models services tests utils views workers main.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build macOS DMG
        env:
          SKIP_PIP_INSTALL: "1"
        run: |
          export PYTHON="$(which python)"
          bash build_dmg.sh

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MMY-ActionFileSync-macOS-${{ matrix.os }}
          path: |
            releases/*/*.dmg
            releases/*/build_info.txt
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MMY-ActionFileSync-macOS-*
          path: dist-artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find dist-artifacts -type f -name '*.dmg' -exec cp -v {} release-files/ \;
          while IFS= read -r -d '' info_file; do
            arch="$(grep -E '^arch=' "$info_file" | head -n 1 | cut -d= -f2- | tr -d '\r\n' || true)"
            if [[ -z "$arch" ]]; then
              echo "[ERROR] Missing arch= in $info_file" >&2
              exit 1
            fi
            cp -v "$info_file" "release-files/build_info-${arch}.txt"
          done < <(find dist-artifacts -type f -name 'build_info.txt' -print0)
          if [[ -z "$(find release-files -maxdepth 1 -type f -name '*.dmg' -print -quit)" ]]; then
            echo "[ERROR] No DMG files found in dist-artifacts" >&2
            exit 1
          fi
          ls -la release-files

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-files/* --clobber
